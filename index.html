<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ניחושים ונחושים 🕎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c1540; --txt:#fff; --mut:#c9cde8; --card:#ffffff10; --line:#ffd45c55;
  --o0:#ff5470; --o1:#41c6f0; --o2:#ffd23f; --o3:#6fe39a; --o4:#c58cff; --ok:#3ddc84;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Rubik,system-ui,sans-serif;color:var(--txt);background:var(--navy)}
body{background:
  radial-gradient(ellipse at 50% -5%,#ffcf5a2e 0,transparent 55%),
  linear-gradient(180deg,#00000000 60%,#00000066),
  repeating-linear-gradient(90deg,#0b1440 0,#16225e 22px,#0e1849 40px,#0b1440 52px);
  background-attachment:fixed}
body.hostmode{background:
  radial-gradient(ellipse at 50% 0%,#ffcf5a26 0,transparent 50%),
  repeating-linear-gradient(90deg,#0b1440 0,#17245f 2.2vw,#0e1849 3.4vw,#0b1440 4.4vw);overflow:hidden}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:16px}
.screen{max-width:560px;margin:0 auto;padding:22px 18px 60px;position:relative}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8vh}
.logo{font-size:72px;animation:bob 2.4s ease-in-out infinite}
h1{margin:6px 0;font-weight:900;font-size:30px;font-family:'Suez One',Rubik,serif;color:#ffe08a;text-shadow:0 3px 0 #5a1a00}
h2{font-size:20px;margin:22px 0 10px;font-family:'Suez One',Rubik,serif;color:#ffe08a}
.sub{color:var(--mut);margin:0 0 10px;line-height:1.5}
.gold-text{font-family:'Suez One',Rubik,serif;background:linear-gradient(180deg,#fff8d6 0%,#ffd75e 42%,#d48a00 55%,#ffd34a 78%,#fff0a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .12em 0 #4a1500) drop-shadow(0 0 .3em #ffb30055)}
.pix{image-rendering:pixelated}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid #fff7;border-radius:999px;padding:12px 22px;font-weight:800;
  background:linear-gradient(180deg,#fff2b0,#ffcc33 45%,#e09a00);color:#4a1d00;text-decoration:none;cursor:pointer;
  box-shadow:0 5px 0 #8a4b00,0 10px 22px #0008;transition:transform .08s;font-family:'Suez One',Rubik,serif;font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4b00,0 6px 14px #0008}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{width:100%;padding:16px;font-size:21px}
.btn.alt{background:linear-gradient(180deg,#e2384f,#a3132a 55%,#7a0b1c);color:#fff;box-shadow:0 5px 0 #43040f,0 10px 22px #0008;border-color:#ffd45c88}
.btn.ghost{background:#0a1238aa;color:#ffd45c;border:2px solid #ffd45c88;box-shadow:none;font-family:Rubik}
.btn.sm{padding:8px 14px;font-size:15px}
.btn.warn{background:#c1121f;color:#fff}
.small-links{margin-top:26px;color:var(--mut);font-size:14px}
.back{position:absolute;top:18px;left:18px;text-decoration:none;font-size:24px;opacity:.7;z-index:5}

/* cards / forms */
.card{background:linear-gradient(180deg,#1a2a6ee6,#0f1a4de6);border:2px solid #ffd45c66;border-radius:20px;padding:16px;margin:12px 0;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 4px #0a1238,0 10px 30px #0006}
.parch{background:linear-gradient(160deg,#fff6d2,#f6d57a);color:#4a2500;border:5px solid #e3ae3a;border-radius:16px;box-shadow:inset 0 0 0 3px #fff6d2,inset 0 0 0 6px #c08a1e,0 12px 30px #0008}
label{font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ffd45c55;background:#070e30;color:#fff;outline:none}
input:focus,select:focus{border-color:#ffd45c}
select option{color:#000}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;width:auto}
.msg{min-height:1.2em;color:#ffd0a0;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:#0004;aspect-ratio:1;border:3px solid #e3ae3a}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;font-size:12px;background:linear-gradient(transparent,#000c)}
.thumb .x{position:absolute;top:6px;left:6px;border:0;border-radius:10px;background:#000a;color:#fff;padding:5px 8px;cursor:pointer}
.filebtn{display:flex;align-items:center;justify-content:center;padding:16px;border:2px dashed #ffd45c88;border-radius:16px;cursor:pointer;font-size:17px;color:#ffe08a}
.prev{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#0004}
.done{text-align:center;font-size:20px;font-weight:700;padding:20px;color:#ffe08a}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:#070e30d9;border:1px solid #ffd45c77;margin:3px;font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#1a1033;flex:none}
img.avimg{object-fit:cover;display:inline-block;background:#0003}
.av-md{width:46px;height:46px;font-size:20px;border:3px solid #fff;border-radius:10px}
.av-lg{width:64px;height:64px;font-size:28px;border:3px solid #e3ae3a;border-radius:12px}
.av-xl{width:130px;height:130px;font-size:56px;border:5px solid #e3ae3a;border-radius:18px;box-shadow:0 8px 30px #0008}
.chip .dot{width:1.7em;height:1.7em}
.regrow{display:flex;gap:12px;align-items:center}
.regrow input{flex:1;min-width:0;width:auto}
.avpick{width:84px;height:84px;border-radius:14px;border:2px dashed #ffd45c99;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex:none;background:#0004}
.avprev{display:flex;flex-direction:column;align-items:center;font-size:26px;text-align:center;line-height:1.1}
.avprev small{font-size:11px;font-weight:500}
.avprev img{width:84px;height:84px;object-fit:cover}
details summary{cursor:pointer;color:var(--mut);margin-top:4px}
.plist{display:flex;flex-wrap:wrap;margin-top:8px}
button.chip{color:#fff;cursor:pointer;font-size:15px}
.lnk{font-weight:500;color:var(--mut);font-size:14px;cursor:pointer;text-decoration:underline}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- marquee logo ---------- */
.marquee{--mq:34px;position:relative;display:inline-block;font-size:var(--mq);padding:.32em .9em .28em;margin-top:.5em;
  background:linear-gradient(180deg,#6a1424,#2e0610);border:.1em solid #e8b84a;border-radius:.6em;
  box-shadow:0 0 0 .06em #6b3a00,0 .3em .8em #000b,inset 0 0 .6em #000;animation:pop .6s both}
.marquee .t{position:relative;z-index:2;line-height:1.05;white-space:nowrap;font-family:'Suez One',Rubik,serif;background:linear-gradient(180deg,#fff8d6 0%,#ffd75e 42%,#d48a00 55%,#ffd34a 78%,#fff0a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em 0 #3a0e00)}
.marquee .lau{font-size:.45em;vertical-align:middle;margin:0 .5em}
.marquee .bulb{position:absolute;width:.2em;height:.2em;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,#fffbe0,#ffcf40 55%,#c27a00);box-shadow:0 0 .2em #ffd34d;animation:chase 1s steps(1) infinite}
.marquee .bulb.b{animation-delay:.5s}
.marquee .crown{position:absolute;top:-.62em;left:50%;transform:translateX(-50%);width:1.9em;height:.7em;padding:.05em .25em 0;background:linear-gradient(180deg,#6a1424,#4a0d17);border:.08em solid #e8b84a;border-bottom:0;border-radius:1em 1em 0 0;z-index:1}
.marquee .crown svg{width:100%;height:100%;display:block}
@keyframes chase{0%{opacity:1}50%{opacity:.25}}

/* menorah */
.menorah .flames{filter:drop-shadow(0 0 3px #ffb300)}
.menorah .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick2 .16s infinite alternate}
@keyframes flick2{to{transform:scaleY(1.18) scaleX(.86)}}

/* pixel cat etc */
.catsign{display:inline-block;font-size:12px;background:#fff3c4;color:#4a1d00;border:2px solid #8a5a00;padding:1px 7px;border-radius:4px;font-weight:800;transform:rotate(-5deg);white-space:nowrap}

/* ---------- phone ---------- */
.phead{text-align:center;margin-bottom:8px}
.phead .marquee{--mq:28px}
.pbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mut);background:#070e30cc;border:1px solid #ffd45c55;border-radius:14px;padding:6px 10px}
.pbar b{color:#fff}
.pbar .dot{width:32px;height:32px;border-radius:8px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{border:3px solid #fff9;border-radius:18px;padding:12px 14px;font-size:21px;font-weight:800;color:#1a1033;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:right;box-shadow:0 6px 0 #0006,inset 0 -6px 0 #0002;animation:pop .35s both}
.opt .sh{width:38px;height:38px;border-radius:50%;background:#fff;border:3px dashed currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 #0006}
.opt.dim{opacity:.3}
.big-emoji{font-size:84px;margin:10px 0;animation:pop .5s both}
.note{background:linear-gradient(#fff3c4,#f5d57a);color:#4a2500;border-radius:14px;padding:12px;margin-bottom:12px;text-align:center;line-height:1.5;border:3px solid #e3ae3a}
.waiting{font-size:20px;line-height:1.6;color:var(--mut)}
.pmen{width:180px;margin:6px auto 0;display:block}

/* ---------- host (big screen) ---------- */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.stage .curtain{position:absolute;top:0;bottom:0;width:7vw;background:repeating-linear-gradient(90deg,#55040f 0,#b3192f 1.1vw,#7a0b1c 2vw,#55040f 2.6vw);box-shadow:0 0 3vw #000c}
.stage .curtain.l{left:0;border-right:.45vw solid #d9a53a;border-radius:0 0 3vw 0}
.stage .curtain.r{right:0;border-left:.45vw solid #d9a53a;border-radius:0 0 0 3vw}
.stage .tassel{position:absolute;top:36%;width:1.1vw;height:7vw;background:linear-gradient(90deg,#8a5a00,#ffd45c,#8a5a00);border-radius:.6vw .6vw .2vw .2vw}
.stage .curtain.l .tassel{right:-.8vw}.stage .curtain.r .tassel{left:-.8vw}
.stage .valance{position:absolute;top:0;left:0;right:0;height:2.4vw;background:repeating-radial-gradient(circle at 50% -1vw,#a3132a 0 2.6vw,#7a0b1c 2.6vw 3.2vw);border-bottom:.3vw solid #d9a53a;box-shadow:0 .5vw 1vw #000a}
.stage .spot{position:absolute;top:0;width:26vw;height:95vh;background:linear-gradient(180deg,#ffe08a40,#ffe08a10 70%,transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(.3vw)}
.stage .spot.l{left:2vw;transform:rotate(-24deg);transform-origin:50% 0}
.stage .spot.r{right:2vw;transform:rotate(24deg);transform-origin:50% 0}
.stage .lamp{position:absolute;top:.6vw;width:4.4vw;height:3vw;border-radius:50% 50% 1vw 1vw;background:radial-gradient(circle at 50% 90%,#fff8d6 0 25%,#ffcf40 35%,#3a2b55 40%,#1a1230 70%);border:.25vw solid #d9a53a}
.stage .lamp.l{left:10vw;transform:rotate(-24deg)}.stage .lamp.r{right:10vw;transform:rotate(24deg)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:11vh;background:linear-gradient(180deg,#9a1228,#5a0815);border-top:.35vw solid #d9a53a}
.stage .step{position:absolute;left:20vw;right:20vw;bottom:11vh;height:3.5vh;background:linear-gradient(180deg,#a3132a,#6e0b1c);border-top:.3vw solid #d9a53a}
.stage .gift{position:absolute;bottom:1vh;width:7vw}
.stage .gift.l{left:.5vw}.stage .gift.r{right:.5vw;width:6vw}
.stage .dreidel{position:absolute;right:8vw;bottom:9vh;width:2.8vw;transform:rotate(16deg)}
#hroot{position:relative;z-index:1;height:100vh;width:100vw}
.h-head{position:absolute;top:1.2vh;left:0;right:0;text-align:center;z-index:3}
.h-head .marquee{--mq:5.2vw}
.h-head .marquee.mini{--mq:2.5vw}
.h-ctrl{position:absolute;top:1.4vh;left:8vw;display:flex;gap:.6vw;align-items:center;z-index:6;direction:rtl}
.h-ctrl .btn{font-size:1vw;padding:.5vw 1vw}
.h-ctrl .chip{font-size:1.1vw}
.hostfig{position:absolute;left:5vw;bottom:0;z-index:4;pointer-events:none}
.hostfig img{display:block;height:100%;filter:drop-shadow(0 1vw 2vw #000b)}
.hostfig.big{height:66vh}
.hostfig.side{height:42vh;left:4vw}
.bubble{position:absolute;bottom:92%;left:55%;background:#fff;color:#1a1033;font-family:'Suez One',Rubik,serif;border-radius:1.4vw;padding:.7vw 1.3vw;font-size:1.7vw;white-space:nowrap;box-shadow:0 .4vw 0 #0005;animation:pop .4s both;border:.25vw solid #1a1033}
.bubble::after{content:'';position:absolute;bottom:-1.1vw;left:2vw;border:.9vw solid transparent;border-top:1.2vw solid #1a1033;border-bottom:0}
.bubble[hidden]{display:none}
.catfig{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.3vw}
.catfig .cat{width:7vw;height:auto;filter:drop-shadow(0 .4vw .4vw #0008)}
.catfig .catsign{font-size:1vw}
.catfig.lob{left:30vw;bottom:1vh}
.catfig.peek{right:-2vw;top:-4.5vw}
.catfig.peek .cat{width:5vw}
.catfig.dance{left:31vw;bottom:2vh;animation:catd .45s ease-in-out infinite alternate}
@keyframes catd{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-1.5vw) rotate(6deg)}}
.men-wrap{position:absolute;left:50%;bottom:.5vh;transform:translateX(-50%);z-index:2;width:21vw}
.men-wrap.sm{width:13vw}
.men-wrap svg{width:100%;display:block;filter:drop-shadow(0 .6vw 1vw #000a)}

/* lobby */
.hl-grid{position:absolute;top:21vh;left:8vw;right:8vw;bottom:17vh;display:grid;grid-template-columns:24vw 26vw 1fr;gap:3vw;direction:ltr;align-items:start}
.hl-mid{display:flex;flex-direction:column;align-items:center;gap:2.4vh;direction:rtl}
.qrcard{padding:1.2vw 1.4vw 1.4vw;text-align:center;width:100%}
.qrcard .qt{font-family:'Suez One',Rubik,serif;font-size:2vw;margin-bottom:.8vw}
.qrcard .qr{width:100%;aspect-ratio:1;display:block;border-radius:.6vw;max-height:38vh;object-fit:contain}
.btn.start{font-size:2.4vw;padding:.9vw 3vw;width:auto;border-width:.25vw}
.stat{font-size:1.1vw;color:var(--mut)}
.hl-right{direction:rtl;display:flex;flex-direction:column;align-items:center;gap:1.2vw}
.ribbon{display:inline-block;background:linear-gradient(180deg,#fff0a0,#e5a400);color:#4a1d00;font-family:'Suez One',Rubik,serif;font-size:1.8vw;padding:.4vw 3vw;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);filter:drop-shadow(0 .3vw 0 #0006)}
.tiles{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:.8vw;width:100%}
.tile{background:linear-gradient(180deg,#1c2c74,#101a4c);border:.25vw solid #e8b84a;border-radius:.7vw;padding:.4vw;text-align:center;animation:pop .4s both;box-shadow:0 .4vw 1vw #0008}
.tile .dot{width:100%;height:auto;aspect-ratio:1;border-radius:.35vw;font-size:3vw}
.tile .nm{margin-top:.35vw;background:linear-gradient(180deg,#fff6d2,#f0cd6a);color:#4a1d00;border-radius:.35vw;font-weight:800;font-size:1.05vw;padding:.1vw .2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles .empty{grid-column:1/-1;text-align:center;color:var(--mut);font-size:1.4vw;padding:2vw}
.neon{font-family:'Suez One',Rubik,serif;color:#ffe3f6;font-size:1.7vw;padding:.4vw 1.2vw;border:.22vw solid #ff8fd8;border-radius:1vw;transform:rotate(-3deg);margin-top:1vw;
  text-shadow:0 0 .2vw #fff,0 0 .8vw #ff3fb4,0 0 1.8vw #ff3fb4;box-shadow:0 0 1vw #ff3fb4,inset 0 0 1vw #ff3fb4aa;animation:neonf 5s infinite}
@keyframes neonf{0%,18%,20%,58%,61%,100%{opacity:1}19%,59.5%{opacity:.3}}

/* question / reveal */
.vote-ban{display:block;width:max-content;margin:1vh auto 0;font-family:'Suez One',Rubik,serif;font-size:1.4vw;color:#fff;background:#a3132a;border:.2vw dashed #ffd45c;padding:.25vw 1.4vw;border-radius:.5vw;transform:rotate(-1.5deg);box-shadow:0 .3vw 0 #0006}
.vote-ban small{font-family:Rubik;font-size:.65em;opacity:.85;margin-inline-start:.6vw}
.hq-grid{position:absolute;top:18vh;left:8vw;right:8vw;bottom:13vh;display:grid;grid-template-columns:15vw 1.25fr 1fr;gap:2vw;direction:ltr;align-items:start}
.frame{position:relative;padding:1vw;border-radius:1vw;background:linear-gradient(135deg,#fff0b0,#c98a00 25%,#ffe27a 50%,#b07400 75%,#ffd45c);box-shadow:0 1.2vw 3vw #000b,inset 0 0 0 .25vw #7a4b00;animation:pop .5s both}
.frame .inner{background:#050a24;height:62vh;display:flex;align-items:center;justify-content:center;border-radius:.4vw;overflow:hidden;box-shadow:inset 0 0 0 .3vw #5a3500}
.frame .inner img{max-width:100%;max-height:100%;object-fit:contain}
.h-cap{position:absolute;bottom:2vw;right:2vw;left:2vw;background:#070e30e6;border:.15vw solid #ffd45c88;border-radius:1vw;padding:.8vw 1.3vw;font-size:1.7vw;direction:rtl;animation:fadeUp .5s .3s both}
.panel{direction:rtl;display:flex;flex-direction:column;gap:1vw}
.qhead{display:flex;align-items:flex-end;gap:1.2vw}
.qhead .qt{font-size:2.8vw;line-height:1.1}
.secs{font-family:'Suez One',Rubik,serif;font-size:2vw;color:#ffd45c}
.ctimer{position:relative;width:2.2vw;height:10vh;flex:none;margin-bottom:.4vw}
.ctimer::after{content:'';position:absolute;bottom:-.5vw;left:-.8vw;right:-.8vw;height:.9vw;border-radius:50%;background:linear-gradient(#ffe27a,#b07400)}
.wax{position:absolute;bottom:0;left:0;right:0;height:calc(var(--f)*100%);background:linear-gradient(90deg,#c4d3ff,#fff 45%,#b9c8f5);border-radius:.4vw .4vw .2vw .2vw}
.wax::before{content:'';position:absolute;top:-2.3vw;left:50%;width:1.3vw;height:2.2vw;margin-left:-.65vw;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fff 0 18%,#ffd45c 40%,#ff7b00 68%,transparent 72%);animation:flick2 .14s infinite alternate;transform-origin:50% 100%;filter:drop-shadow(0 0 .6vw #ffb300)}
.h-opts{display:flex;flex-direction:column;gap:.8vw}
.h-opt{position:relative;display:flex;align-items:center;gap:1vw;padding:.6vw 1vw;border-radius:1.2vw;background:linear-gradient(180deg,#1f3080,#0f1a4c);border:.22vw solid #e8b84a;box-shadow:0 .35vw 0 #0008;font-size:2vw;font-weight:800;animation:pop .4s both;transition:opacity .4s,transform .4s}
.h-opt .chipc{width:3.2vw;height:3.2vw;border-radius:50%;background:var(--c);border:.3vw dashed #fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.3vw;color:#1a1033;flex:none;box-shadow:0 0 0 .2vw var(--c)}
.av-h{width:3.4vw;height:3.4vw;font-size:1.6vw;border-radius:.5vw;border:.2vw solid #fff}
.h-opt .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-opt .vc{display:flex;align-items:center;gap:.2vw;font-size:1.4vw}
.coin{width:1.3vw;height:1.3vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f2b821 55%,#a86a00);border:.12vw solid #7a4b00;margin-left:-.5vw;box-shadow:0 .1vw 0 #0006}
.h-opt.wrong{opacity:.35;transform:scale(.96)}

<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, query, where, getDocs, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzh-n0PQMLGuPA5ViZDrwFKuLidDrecG0",
  authDomain: "friends-photo-game.firebaseapp.com",
  projectId: "friends-photo-game",
  storageBucket: "friends-photo-game.firebasestorage.app",
  messagingSenderId: "9323915169",
  appId: "1:9323915169:web:c44fe2d661490cf3900de0"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const G = 'main';
const gref = doc(db, 'games', G);
const col = n => collection(db, 'games', G, n);
const dref = (n, id) => doc(db, 'games', G, n, id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const OPT_COLORS = ['var(--o0)', 'var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--o4)'];
const OPT_SHAPES = ['▲', '◆', '●', '■', '★'];
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const pcolor = s => `hsl(${hue(s)} 85% 68%)`;
// pixelated version of each profile photo (retro look), cached per person
const PIX = new Map(), PIXSRC = new Map();
function pixOf(id, src) {
  if (PIXSRC.get(id) === src) return PIX.get(id) || src;
  PIXSRC.set(id, src); PIX.delete(id);
  loadImg(src).then(img => {
    const c = document.createElement('canvas'); c.width = c.height = 30;
    c.getContext('2d').drawImage(img, 0, 0, 30, 30);
    const u = c.toDataURL('image/png'); PIX.set(id, u);
    $$(`img[data-av="${id}"]`).forEach(i => { i.src = u; });
  }).catch(() => {});
  return src;
}
const PEOPLE = new Map();
const av = (pp, cls = '') => {
  const p = typeof pp === 'string' ? PEOPLE.get(pp) : pp; const name = p?.name || '?';
  return p?.avatar ? `<img class="dot avimg pix ${cls}" data-av="${p.id}" src="${pixOf(p.id, p.avatar)}" alt="">` : `<span class="dot ${cls}" style="background:${pcolor(name)}">${esc(name.trim()[0] || '?')}</span>`;
};

/* ---------- pixel art + stage decorations ---------- */
const PAL = { K: '#262636', G: '#8d8f9c', L: '#b9bbc8', W: '#f6f6f6', P: '#f29bb0', E: '#15151f', R: '#c8102e', r: '#8a0b1f', Y: '#ffd23f', y: '#c9910a', B: '#2f6fe0', b: '#1d48a8', N: '#fff3c4' };
const CAT = [
  '..K.......K.....',
  '.KGK.....KGK....',
  '.KPGK...KGPK....',
  '.KGGGKKKGGGK....',
  'KGGGGGGGGGGGK...',
  'KGEWGGGGGEWGK...',
  'KGEEGGGGGEEGK...',
  'KGGGGWPWGGGGK...',
  '.KGGWWWWWGGK....',
  '..KKGWWWGKK.....',
  '..KGGWWWGGK.....',
  '.KGGGWWWGGGK..KK',
  '.KGGGWWWGGGK.KGK',
  '.KGGWWWWWGGKKGK.',
  '.KGWWKWKWWGGGK..',
  '.KKKK.K.KKKKK...'];
const GIFT = [
  '...YY..YY...',
  '..Y..YY..Y..',
  '...YYYYYY...',
  'RRRRRYYRRRRR',
  'RRRRRYYRRRRR',
  'YYYYYYYYYYYY',
  'rRRRRYYRRRRr',
  'rRRRRYYRRRRr',
  'rRRRRYYRRRRr',
  'rRRRRYYRRRRr',
  'rrrrrYyrrrrr'];
const GIFT2 = GIFT.map(r => r.replace(/R/g, 'B').replace(/r/g, 'b'));
const DREIDEL = [
  '....KK....',
  '....yy....',
  '..KKKKKK..',
  '.KBBBBBBK.',
  '.KBYYYYBK.',
  '.KBBBBYBK.',
  '.KBBBBYBK.',
  '.KBYYYYBK.',
  '.KBBBBBBK.',
  '..KBBBBK..',
  '...KBBK...',
  '....KK....'];
function pixelSVG(rows, cls = '') {
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) r += `<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${PAL[ch]}"/>`; }));
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
}
function menorahSVG(lit = 0, cls = '', shamash = lit > 0) {
  const xs = [22, 42, 62, 82, 118, 138, 158, 178];
  const litSet = new Set([...xs].reverse().slice(0, lit));
  let arms = '', cups = '', cand = '', fl = '';
  for (let i = 0; i < 4; i++) { const x = xs[i], r = 100 - x; arms += `<path d="M${x} 58 A${r} ${Math.round(r * 0.62)} 0 0 0 ${200 - x} 58"/>`; }
  [...xs.slice(0, 4), 100, ...xs.slice(4)].forEach(x => {
    const sh = x === 100, top = sh ? 42 : 52;
    cups += `<rect x="${x - 7}" y="${top}" width="14" height="6" rx="2"/>`;
    cand += `<rect x="${x - 3}" y="${top - 16}" width="6" height="16" rx="1.5" fill="${sh ? '#fff3c4' : (x < 100 ? '#d6e2ff' : '#ffffff')}"/>`;
    if (sh ? shamash : litSet.has(x)) fl += `<path class="fl" d="M${x} ${top - 31} C ${x + 6} ${top - 23}, ${x + 5} ${top - 16}, ${x} ${top - 16} C ${x - 5} ${top - 16}, ${x - 6} ${top - 23}, ${x} ${top - 31} Z"/>`;
  });
  return `<svg class="menorah ${cls}" viewBox="0 0 200 136"><defs>
    <linearGradient id="mg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".5" stop-color="#f2b821"/><stop offset="1" stop-color="#a86a00"/></linearGradient>
    <radialGradient id="fg" cx=".5" cy=".72" r=".65"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ffd45c"/><stop offset="1" stop-color="#ff6a00"/></radialGradient></defs>
    <g fill="none" stroke="url(#mg)" stroke-width="5" stroke-linecap="round">${arms}<path d="M100 48 V122"/></g>
    <g fill="url(#mg)">${cups}<path d="M68 132 Q100 108 132 132 Z"/><rect x="72" y="129" width="56" height="7" rx="3"/></g>
    <g>${cand}</g><g fill="url(#fg)" class="flames">${fl}</g></svg>`;
}
function bulbsHTML(nx = 16, ny = 3) {
  let s = '', k = 0; const add = (l, t) => { s += `<i class="bulb ${k++ % 2 ? 'b' : ''}" style="left:${l}%;top:${t}%"></i>`; };
  for (let i = 0; i < nx; i++) add((i + .5) / nx * 100, 0);
  for (let i = 0; i < ny; i++) add(100, (i + .5) / ny * 100);
  for (let i = nx - 1; i >= 0; i--) add((i + .5) / nx * 100, 100);
  for (let i = ny - 1; i >= 0; i--) add(0, (i + .5) / ny * 100);
  return s;
}
const marquee = (cls = '') => `<div class="marquee ${cls}"><div class="crown">${menorahSVG(8)}</div>${bulbsHTML()}<div class="t"><span class="lau">✦</span>ניחושים ונחושים<span class="lau">✦</span></div></div>`;
function addStage() {
  if ($('.stage')) return;
  const s = document.createElement('div'); s.className = 'stage';
  s.innerHTML = `<div class="spot l"></div><div class="spot r"></div>
    <div class="curtain l"><i class="tassel"></i></div><div class="curtain r"><i class="tassel"></i></div>
    <div class="valance"></div><div class="lamp l"></div><div class="lamp r"></div>
    <div class="step"></div><div class="floor"></div>
    ${pixelSVG(GIFT2, 'gift l')}${pixelSVG(GIFT, 'gift r')}${pixelSVG(DREIDEL, 'dreidel')}`;
  document.body.prepend(s);
}
const GAME_URL = location.origin + location.pathname;

let unsubs = [], timers = [];
function cleanup() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; timers.forEach(clearInterval); timers = []; document.onkeydown = null; document.body.classList.remove('hostmode'); $('.confetti')?.remove(); $('.stage')?.remove(); }
const listen = (ref, cb) => unsubs.push(onSnapshot(ref, cb, err => console.error(err)));

function watchPeople(cb) {
  listen(col('people'), s => {
    const arr = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name, 'he'));
    PEOPLE.clear(); arr.forEach(p => PEOPLE.set(p.id, p)); cb(arr);
  });
}

const imgCache = new Map();
function getDisplay(id) {
  if (!imgCache.has(id)) imgCache.set(id, getDoc(dref('photoData', id)).then(s => s.exists() ? s.data().display : '').catch(() => ''));
  return imgCache.get(id);
}

function confirmBtn(btn, fn) {
  let armed = false, t; const orig = btn.innerHTML;
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.innerHTML = 'בטוח? לחץ שוב'; btn.classList.add('warn'); t = setTimeout(() => { armed = false; btn.innerHTML = orig; btn.classList.remove('warn'); }, 3000); return; }
    clearTimeout(t); armed = false; btn.innerHTML = orig; btn.classList.remove('warn'); fn();
  });
}

async function deleteAll(name) {
  const s = await getDocs(col(name)); let b = writeBatch(db), n = 0;
  for (const d of s.docs) { b.delete(d.ref); if (++n % 400 === 0) { await b.commit(); b = writeBatch(db); } }
  await b.commit();
}

// resize to JPEG data URL that fits comfortably in a Firestore document
function canvasToJpeg(c, limit = 400000) {
  let q = 0.85, out = c.toDataURL('image/jpeg', q);
  while (out.length > limit) {
    if (q > 0.55) q -= 0.1;
    else { const n = document.createElement('canvas'); n.width = Math.round(c.width * 0.8); n.height = Math.round(c.height * 0.8); n.getContext('2d').drawImage(c, 0, 0, n.width, n.height); c = n; }
    out = c.toDataURL('image/jpeg', q);
  }
  return out;
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = src; }); }
async function fileToJpeg(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    return canvasToJpeg(c);
  } finally { URL.revokeObjectURL(url); }
}

async function fileToAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url); const s = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = 256;
    c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 256, 256);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}

// self sign-up: name + profile photo (or pick yourself if already registered)
function registerUI(el, people, onDone) {
  let avatar = null;
  el.innerHTML = `<div class="card">
    <label>מי את/ה? 👋</label>
    <div class="regrow"><label class="avpick"><input type="file" accept="image/*" hidden><span class="avprev">📷<small>תמונת<br>פרופיל</small></span></label>
      <input class="rname" maxlength="24" placeholder="השם שלך"></div>
    <button class="btn big rgo">זה אני ✓</button><div class="msg rmsg"></div>
    ${people.length ? `<details><summary>כבר נרשמת? לחצו כאן ובחרו את עצמכם</summary><div class="plist">${people.map(p => `<button class="chip pick" data-id="${p.id}">${av(p)}${esc(p.name)}</button>`).join('')}</div></details>` : ''}
  </div>`;
  const inp = $('input[type=file]', el), prev = $('.avprev', el), msg = $('.rmsg', el);
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { avatar = await fileToAvatar(f); prev.innerHTML = `<img src="${avatar}" alt="">`; msg.textContent = ''; }
    catch (e) { msg.textContent = 'לא הצלחתי לקרוא את התמונה, נסו אחרת'; }
  };
  $('.rgo', el).onclick = async () => {
    const name = $('.rname', el).value.trim();
    if (!name) { msg.textContent = 'צריך לכתוב שם 🙂'; return; }
    if (!avatar) { msg.textContent = 'צריך להוסיף תמונת פרופיל 📷'; return; }
    if (people.some(p => p.name.trim() === name)) { msg.textContent = `כבר יש "${name}". אם זה את/ה, בחרו מ"כבר נרשמת". אחרת הוסיפו אות משפחה`; return; }
    $('.rgo', el).disabled = true;
    const id = uid();
    try { await setDoc(dref('people', id), { name, avatar, createdAt: Date.now() }); }
    catch (e) { console.error(e); msg.textContent = 'משהו השתבש, נסו שוב'; $('.rgo', el).disabled = false; return; }
    localStorage.setItem('pg_person', id); onDone(id, name);
  };
  $$('.pick', el).forEach(b => b.onclick = () => { const p = people.find(x => x.id === b.dataset.id); localStorage.setItem('pg_person', p.id); onDone(p.id, p.name); });
}

/* ================= router ================= */
function route() {
  cleanup();
  const r = location.hash.replace('#', '') || 'home';
  ({ home, upload, play, host, admin }[r] || home)();
}
window.addEventListener('hashchange', route);

/* ================= home ================= */
function home() {
  app.innerHTML = `<div class="screen center">
    ${marquee()}
    <div style="width:200px">${menorahSVG(8, 'pmen')}</div>

  let deviceId = localStorage.getItem('pg_device');
  if (!deviceId) { deviceId = uid(); localStorage.setItem('pg_device', deviceId); }
  let me = localStorage.getItem('pg_person') || '', people = [], state = null, player = undefined;

  const nameOf = id => people.find(p => p.id === id)?.name || '?';

  watchPeople(p => { const had = people.length; people = p; if (!had && p.length && player === null) { joinShown = false; } render(); });
  listen(gref, s => { state = s.data() || { phase: 'lobby' }; render(); });
  listen(dref('players', deviceId), s => { player = s.exists() ? s.data() : null; render(); });
  listen(col('players'), s => { players = s.docs.map(d => d.data()); if (state && ['titles', 'podium'].includes(state.phase)) render(); });
  unsubs.push(() => unsubAns && unsubAns());

  function watchAnswer(r) {
    if (ansRound === r) return;
    ansRound = r; myAns = null;
    if (unsubAns) unsubAns();

  }

  function render() {
    if (player === undefined || !state) { app.innerHTML = `<div class="screen center"><div class="logo">📸</div><p class="waiting">מתחבר…</p></div>`; return; }
    if (!player) { if (!joinShown) { joinShown = true; renderJoin(); } return; }
    joinShown = false;
    const top = `<div class="pbar"><span>${av(player.personId)} <b>${esc(player.name)}</b></span><span>⭐ <b>${player.score || 0}</b></span></div>`;
    const ph = state.phase;
    if (ph === 'question' || ph === 'reveal') watchAnswer(state.round);
    if (ph === 'question') {
      if (seenRound !== state.round) { seenRound = state.round; seenAt = performance.now(); }
      const isOwner = state.ownerId === player.personId;
      if (myAns) { app.innerHTML = `<div class="screen">${top}<div class="center" style="padding-top:8vh"><div class="big-emoji">⏳</div><p class="waiting">ענית: <b>${esc(nameOf(myAns.choice))}</b><br>מחכים לכולם…</p></div></div>`; return; }
      app.innerHTML = `<div class="screen">${top}
        ${isOwner ? `<div class="note">🤫 <b>זו התמונה שלך! תבלפו</b><br>תבחרו מישהו אחר כדי להטעות (על התמונה שלכם אין נקודות)</div>` : `<p class="sub" style="text-align:center;font-size:18px">של מי התמונה? 👀</p>`}
        <div class="opts">${(state.options || []).map((id, i) => `<button class="opt" data-id="${id}" style="background:${OPT_COLORS[i]};animation-delay:${i * 60}ms"><span class="sh">${OPT_SHAPES[i]}</span>${av(id, 'av-md')}${esc(nameOf(id))}</button>`).join('')}</div></div>`;
      $$('.opt').forEach(b => b.onclick = async () => {
        $$('.opt').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
        const r = state.round;
        await setDoc(dref('answers', `${r}_${deviceId}`), { round: r, deviceId, personId: player.personId, choice: b.dataset.id, ms: Math.round(performance.now() - seenAt) });
      });

    }
    if (ph === 'reveal') {
      const isOwner = state.ownerId === player.personId;
      if (isOwner) {
        const sh = state.shared;
        app.innerHTML = `<div class="screen">${top}<div class="center" style="padding-top:5vh">
          <div class="big-emoji">📸</div><h1>זו הייתה התמונה שלך!</h1>
          <p class="sub">${state.correctCount || 0} מתוך ${state.voters || 0} זיהו אותך</p>
          ${sh == null ? `<p class="waiting">רוצה לספר על התמונה?</p>
            <button class="btn big" id="shY">🎤 בא לי לספר</button><button class="btn big ghost" id="shN">⏭ דלג</button>`
            : `<p class="waiting">${sh ? '🎤 הבמה שלך!' : '⏭ דילגת. מחכים לתמונה הבאה'}</p>`}</div></div>`;
        if (sh == null) { $('#shY').onclick = () => updateDoc(gref, { shared: true }); $('#shN').onclick = () => updateDoc(gref, { shared: false }); }
        return;

      else if (myAns.choice === state.ownerId) { em = '🎉'; txt = `צדקת!${myAns.points != null ? `<br><b style="font-size:30px;color:#ffd60a">+${myAns.points}</b>` : ''}`; }

      app.innerHTML = `<div class="screen">${top}<div class="center" style="padding-top:8vh"><div class="big-emoji">${em}</div><p class="waiting" style="font-size:22px">${txt}</p></div></div>`;
      return;

    if (ph === 'titles' || ph === 'podium') {
      const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));

    $('#chg').onclick = async () => { await deleteDoc(dref('players', deviceId)); };
  }

  function renderJoin() {
    const p = people.find(x => x.id === me);
    app.innerHTML = `<div class="screen"><a class="back" href="#">←</a><div class="phead">${marquee()}</div><div class="center" style="padding-top:0"><h1>הצטרפות למשחק</h1></div><div id="jw"></div></div>`;
    const join = async (id, name) => { me = id; await setDoc(dref('players', deviceId), { personId: id, name, joinedAt: Date.now() }, { merge: true }); };
    if (p) {
      $('#jw').innerHTML = `<div class="card" style="align-items:center;text-align:center">${av(p, 'av-xl')}<b style="font-size:24px">${esc(p.name)}</b>
        <button class="btn big" id="asMe">להצטרף 🚀</button><button class="btn sm ghost" id="other">זה לא אני</button></div>`;
      $('#asMe').onclick = () => join(p.id, p.name);
      $('#other').onclick = () => { me = ''; localStorage.removeItem('pg_person'); renderJoin(); };
      return;
    }
    registerUI($('#jw'), people, join);
  }
  render();
}

/* ================= host / big screen ================= */
function host() {
  document.body.classList.add('hostmode'); addStage();
  let people = [], photos = [], players = [], state = null, answers = [], ansRound = -1, unsubAns = null;
  let revealing = false, busy = false, lastKey = '';
  const nameOf = id => people.find(p => p.id === id)?.name || '?';

  const softForce = () => !state || state.phase === 'lobby';
  watchPeople(p => { people = p; render(softForce()); });
  listen(col('photos'), s => { photos = s.docs.map(d => ({ id: d.id, ...d.data() })); render(softForce()); });
  listen(col('players'), s => { players = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  listen(gref, async s => {
    if (!s.exists()) { await setDoc(gref, { phase: 'lobby', round: -1, duration: 20 }); return; }
    state = s.data();
    if ((state.phase === 'question' || state.phase === 'reveal') && ansRound !== state.round) {
      ansRound = state.round; answers = [];
      if (unsubAns) unsubAns();
      unsubAns = onSnapshot(query(col('answers'), where('round', '==', state.round)), q => { answers = q.docs.map(d => d.data()); render(); });
    }
    render();
  });
  unsubs.push(() => unsubAns && unsubAns());

  timers.push(setInterval(tick, 200));
  document.onkeydown = e => { if (['Space', 'Enter', 'ArrowLeft'].includes(e.code)) { e.preventDefault(); next(); } };

  function tick() {
    if (!state || state.phase !== 'question') return;
    const dur = (state.duration || 20) * 1000, left = Math.max(0, dur - (Date.now() - state.startedAt));
    const wax = $('#wax'); if (wax) wax.style.setProperty('--f', Math.max(0.04, left / dur));
    const t = $('#tleft'); if (t) t.textContent = Math.ceil(left / 1000) + ' שניות';
    setBubble(left <= 5000 ? 'יאללה! תן שם של סינים!' : '');
    const allIn = players.length > 0 && answers.length >= players.length;
    if (left <= 0 || allIn) reveal();
  }

  async function reveal() {
    if (revealing || !state || state.phase !== 'question') return;
    revealing = true;
    try {
      const r = state.round, owner = state.ownerId, dur = (state.duration || 20) * 1000;
      const snap = await getDocs(query(col('answers'), where('round', '==', r)));
      const batch = writeBatch(db); const votes = {}; let correct = 0, voters = 0, ownerChoice = null;
      for (const d of snap.docs) {
        const a = d.data();
        votes[a.choice] = (votes[a.choice] || 0) + 1;
        if (a.personId === owner) { ownerChoice = a.choice; continue; }
        voters++;
        const ok = a.choice === owner; let pts = 0;
        if (ok) { correct++; pts = 100 + Math.round(50 * Math.max(0, 1 - a.ms / dur)); }
        batch.update(d.ref, { points: pts, correct: ok });
        batch.set(dref('players', a.deviceId), { score: increment(pts), correctN: increment(ok ? 1 : 0), answeredN: increment(1), sumMs: increment(ok ? a.ms : 0) }, { merge: true });
      }
      batch.set(dref('history', String(r)), { round: r, photoId: state.photoId, ownerId: owner, votes, correct, voters, ownerChoice, shared: null });
      batch.update(gref, { phase: 'reveal', votes, correctCount: correct, voters, shared: null });
      await batch.commit();
    } catch (e) { console.error(e); }
    revealing = false;
  }

  function buildOrder() {
    const byOwner = {};
    photos.forEach(p => (byOwner[p.ownerId] = byOwner[p.ownerId] || []).push(p.id));
    const first = [], rest = [];
    shuffle(Object.keys(byOwner)).forEach(o => { const s = shuffle(byOwner[o]); first.push({ id: s[0], o }); s.slice(1).forEach(id => rest.push({ id, o })); });
    // spread the rest so the same person doesn't appear twice in a row
    let pool = shuffle(rest), out = [], last = first.length ? first[first.length - 1].o : null;
    while (pool.length) {
      let i = pool.findIndex(x => x.o !== last); if (i < 0) i = 0;
      const [x] = pool.splice(i, 1); out.push(x); last = x.o;
    }
    return [...first, ...out].map(x => x.id);
  }

  async function startRound(i, order, ownerOf, counts) {
    const photoId = order[i], ownerId = ownerOf[photoId];
    counts = { ...(counts || {}) };
    const pool = shuffle(people.filter(p => p.id !== ownerId)).sort((a, b) => (counts[a.id] || 0) - (counts[b.id] || 0));
    const d = pool.slice(0, 4); d.forEach(p => counts[p.id] = (counts[p.id] || 0) + 1);
    const options = shuffle([ownerId, ...d.map(p => p.id)]);
    getDisplay(photoId); if (order[i + 1]) getDisplay(order[i + 1]);
    await updateDoc(gref, { phase: 'question', round: i, photoId, ownerId, options, startedAt: Date.now(), distractorCounts: counts, shared: null, votes: {}, correctCount: 0, voters: 0 });
  }

  async function resetScores() {
    await deleteAll('answers'); await deleteAll('history');
    const s = await getDocs(col('players')); const b = writeBatch(db);
    s.docs.forEach(d => b.set(d.ref, { score: 0, correctN: 0, answeredN: 0, sumMs: 0 }, { merge: true }));
    await b.commit();
  }

  async function startGame() {
    if (busy) return; busy = true;
    try {
      const order = buildOrder();
      const ownerOf = Object.fromEntries(photos.map(p => [p.id, p.ownerId]));
      await resetScores();
      await updateDoc(gref, { order, ownerOf, distractorCounts: {} });
      await startRound(0, order, ownerOf, {});
    } finally { busy = false; }
  }

  async function next() {
    if (!state || busy) return; busy = true;
    try {
      if (state.phase === 'lobby') { busy = false; return startGame(); }
      if (state.phase === 'question') { busy = false; return reveal(); }
      if (state.phase === 'reveal') {
        await setDoc(dref('history', String(state.round)), { shared: state.shared ?? false }, { merge: true });
        if (state.round + 1 < (state.order || []).length) await startRound(state.round + 1, state.order, state.ownerOf, state.distractorCounts);
        else await updateDoc(gref, { phase: 'titles' });
      } else if (state.phase === 'titles') await updateDoc(gref, { phase: 'podium' });
    } finally { busy = false; }
  }

  async function endNow() {
    if (state.phase === 'reveal') await setDoc(dref('history', String(state.round)), { shared: state.shared ?? false }, { merge: true });
    await updateDoc(gref, { phase: 'titles' });
  }

  function render(force) {
    if (!state) { app.innerHTML = '<div class="screen center"><p class="waiting">טוען…</p></div>'; return; }
    const key = `${state.phase}|${state.round}`;
    if (force || key !== lastKey || !$('#hroot')) { lastKey = key; full(); }
    dynamic();
  }

  const ctrl = extra => `<div class="h-ctrl">${(state.order || []).length && ['question', 'reveal'].includes(state.phase) ? `<span class="chip">תמונה ${state.round + 1} / ${state.order.length}</span>` : ''}${extra}</div>`;
  const hostFig = (cls, bubble = '') => `<div class="hostfig ${cls}"><div class="bubble" id="bub" ${bubble ? '' : 'hidden'}>${esc(bubble)}</div><img src="assets/host.webp" alt=""></div>`;
  const catFig = (cls, sign = true) => `<div class="catfig ${cls}">${sign ? '<div class="catsign">אוחנה הוא חתול</div>' : ''}${pixelSVG(CAT, 'cat')}</div>`;
  const progress = () => { const t = (state.order || []).length; return t ? Math.min(8, Math.ceil(8 * (state.round + 1) / t)) : 0; };
  const setBubble = txt => { const b = $('#bub'); if (!b) return; if (!txt) { b.hidden = true; return; } if (b.textContent !== txt || b.hidden) { b.textContent = txt; b.hidden = false; } };

  function full() {
    const ph = state.phase;
    if (ph === 'lobby') {
      const joinUrl = GAME_URL + '#play';
      app.innerHTML = `<div id="hroot">
        ${ctrl(`<a class="btn sm ghost" href="#admin">⚙️ ניהול</a>`)}
        <div class="h-head">${marquee()}</div>
        <div class="hl-grid">
          <div></div>
          <div class="hl-mid">
            <div class="parch qrcard"><div class="qt">סרקו כדי להצטרף</div>
              <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=8&color=2a1400&bgcolor=fff6d6&data=${encodeURIComponent(joinUrl)}" alt="QR"></div>
            <button class="btn start" id="start">✦ מתחילים! ✦</button>
            <div class="stat" id="stat"></div>
          </div>
          <div class="hl-right"><div class="ribbon">כבר הצטרפו:</div><div class="tiles" id="joined"></div><div class="neon">אין זוגות בגרעין</div></div>
        </div>
        ${hostFig('big', 'ברוכים הבאים!')}${catFig('lob')}
        <div class="men-wrap">${menorahSVG(0)}</div></div>`;
      $('#start').onclick = startGame;
      return;
    }
    if (ph === 'question' || ph === 'reveal') {
      const isRev = ph === 'reveal';
      const photo = photos.find(p => p.id === state.photoId) || {};
      app.innerHTML = `<div id="hroot">
        ${ctrl(`<button class="btn sm ghost" id="end">🏁 סיום</button><button class="btn sm" id="nxt">${isRev ? 'הבא ⏭' : 'לחשוף 👀'}</button>`)}
        <div class="h-head">${marquee('mini')}${isRev ? '' : `<div class="vote-ban">אין הצבעות בגרעין<small>*חוץ מעכשיו</small></div>`}</div>
        <div class="hq-grid">
          <div></div>
          <div class="frame"><div class="inner"><img id="pimg" alt=""></div>${isRev && photo.caption ? `<div class="h-cap">💬 ${esc(photo.caption)}</div>` : ''}${catFig('peek', false)}</div>
          <div class="panel">
            ${isRev ? `<div class="h-owner">${av(state.ownerId, 'av-own')}<div><small>התמונה של</small><div class="gold-text">${esc(nameOf(state.ownerId))}!</div></div></div>`
              : `<div class="qhead"><div class="ctimer"><div class="wax" id="wax" style="--f:1"></div></div><div><div class="gold-text qt">של מי התמונה?</div><div class="secs" id="tleft"></div></div></div>`}

  async function renderTitles() {
    app.innerHTML = `<div id="hroot">${ctrl(`<button class="btn sm" id="nxt">לפודיום 🏆</button>`)}

    const per = {}, wrongVotes = {};
    hs.forEach(h => {
      const o = per[h.ownerId] = per[h.ownerId] || { n: 0, r: 0, bluff: 0, shared: 0 };
      o.n++; o.r += h.voters ? h.correct / h.voters : 0;

    const open = best(owners.filter(o => o.id !== surp?.id), o => o.avg);
    if (open) T.push(['📖', 'ספר פתוח', [open.id], `${Math.round(open.avg * 100)}% זיהו מיד`]);
    const sus = best(Object.entries(wrongVotes).filter(([, c]) => c > 0), ([, c]) => c);
    if (sus) T.push(['🎯', 'החשוד/ה הקבוע/ה', [sus[0]], `${sus[1]} פעמים חשבו שזה את/ה`]);
    const bl = best(owners.filter(o => o.bluff), o => o.bluff);
    if (bl) T.push(['🃏', 'מאסטר/ית בלוף', [bl.id], `בלפ/ה על ${bl.bluff} תמונות`]);
    const st = best(owners.filter(o => o.shared), o => o.shared);
    if (st) T.push(['🎤', 'מספר/ת הסיפורים', [st.id], `סיפר/ה על ${st.shared} תמונות`]);
    const cp = best(Object.entries(pairs).filter(([, c]) => c >= 2), ([, c]) => c);
    if (cp) T.push(['💞', 'הזוג המסונכרן', cp[0].split('|'), `${cp[1]} תשובות זהות · ואין זוגות בגרעין 😉`]);

    tl.innerHTML = T.length ? T.map((t, i) => `<div class="tcard parch" style="animation-delay:${i * 0.6}s"><div class="e">${t[0]}</div><div class="t">${t[1]}</div>

      : '<p class="waiting" style="text-align:center;grid-column:1/-1">לא שוחקו מספיק סבבים לתארים 🙂</p>';
  }

    const col3 = (p, place) => p ? `<div class="pcol p${place}">

        <div class="pname">${esc(p.name)}</div><div class="pscore">${p.score || 0} נק׳</div>
        <div class="pblock">${place}</div></div>` : '';
    app.innerHTML = `<div id="hroot">${ctrl(`<button class="btn sm ghost" id="back">↩ ללובי</button>`)}
      <div class="h-head">${marquee('mini')}</div>
      <div class="others">${sorted.slice(3).map((p, i) => `<span class="chip">${i + 4}. ${av(p.personId)}${esc(p.name)} · ${p.score || 0}</span>`).join('')}</div>
      <div class="podium">${col3(sorted[1], 2)}${col3(sorted[0], 1)}${col3(sorted[2], 3)}</div>
      ${hostFig('side', 'מזל טוב!! 🎉')}${catFig('dance', false)}
      <div class="podium-men">${menorahSVG(8)}</div></div>`;
    confirmBtn($('#back'), () => updateDoc(gref, { phase: 'lobby', round: -1 }));
    const cf = document.createElement('div'); cf.className = 'confetti';
    const cols = ['#ffd45c', '#ff5470', '#41c6f0', '#fff', '#c58cff'];
    cf.innerHTML = Array.from({ length: 110 }, (_, i) => `<i class="${i % 3 === 0 ? 'c' : ''}" style="left:${Math.random() * 100}vw;background:${cols[Math.floor(Math.random() * cols.length)]};animation-duration:${3 + Math.random() * 4}s;animation-delay:${-Math.random() * 6}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('');
    document.body.appendChild(cf);
  }
}

/* ---------- face blur editor ---------- */
let detectorP = null;
function getDetector() {
  if (!detectorP) detectorP = (async () => {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const v = await import(base + '/vision_bundle.mjs');
    const fs = await v.FilesetResolver.forVisionTasks(base + '/wasm');
    return v.FaceDetector.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
      runningMode: 'IMAGE', minDetectionConfidence: 0.45
    });
  })().catch(e => { detectorP = null; throw e; });
  return detectorP;
}
async function detectFaces(img) {
  const det = await getDetector();
  const W = img.naturalWidth, H = img.naturalHeight, found = [];
  const run = (sx, sy, sw, sh) => {
    const c = document.createElement('canvas'); const sc = Math.min(1, 1024 / Math.max(sw, sh));
    c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    for (const d of det.detect(c).detections) {
      const b = d.boundingBox, score = d.categories?.[0]?.score ?? 1;
      if (score < 0.6 || b.width < 12 || b.height < 12 || b.width > c.width * 0.9 || b.height > c.height * 0.9) continue;
      const ar = b.width / b.height; if (ar < 0.5 || ar > 2) continue;
      if (b.originX < -b.width * 0.3 || b.originY < -b.height * 0.3 || b.originX + b.width > c.width * 1.1 || b.originY + b.height > c.height * 1.1) continue;
      found.push({ x: sx + b.originX / sc, y: sy + b.originY / sc, w: b.width / sc, h: b.height / sc });
    }
  };
  run(0, 0, W, H);
  const tw = W * 0.6, th = H * 0.6;
  for (const fx of [0, 0.4]) for (const fy of [0, 0.4]) run(W * fx, H * fy, tw, th);
  // merge overlapping detections
  const iou = (a, b) => { const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h); const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return i / Math.min(a.w * a.h, b.w * b.h); };
  const out = [];
  found.sort((a, b) => b.w * b.h - a.w * a.h).forEach(f => { if (!out.some(o => iou(o, f) > 0.3)) out.push(f); });
  // grow box to cover hair / chin
  return out.map(f => {
    const w = f.w * 1.45, h = f.h * 1.7;
    const x = Math.max(0, f.x + f.w / 2 - w / 2), y = Math.max(0, f.y + f.h / 2 - h * 0.55);
    return { x, y, w: Math.min(w, W - x), h: Math.min(h, H - y) };
  });
}
function blurBox(ctx, b) {
  const tw = Math.max(2, Math.round(b.w / 16)), th = Math.max(2, Math.round(b.h / 16));
  const t = document.createElement('canvas'); t.width = tw; t.height = th;
  t.getContext('2d').drawImage(ctx.canvas, b.x, b.y, b.w, b.h, 0, 0, tw, th);
  ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, b.h / 2, 0, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(t, 0, 0, tw, th, b.x, b.y, b.w, b.h); ctx.restore();
}
async function openBlur(id) {
  const s = await getDoc(dref('photoData', id)); const orig = s.data().orig;
  const img = await loadImg(orig);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="help" id="bst">🔍 מזהה פנים…</div><canvas id="bc"></canvas>
    <div class="help">גררו כדי להוסיף אזור טשטוש · לחיצה על אזור מוחקת אותו</div>
    <div class="row"><button class="btn" id="bsave">💾 שמירה</button><button class="btn ghost" id="bclr">ניקוי הכל</button><button class="btn ghost" id="bcancel">ביטול</button></div>`;
  document.body.appendChild(m);
  const c = $('#bc', m), ctx = c.getContext('2d'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  let boxes = [], drag = null;
  const draw = (preview = true) => {
    ctx.drawImage(img, 0, 0);
    boxes.forEach(b => blurBox(ctx, b));
    const tmp = drag && drag.moved ? [norm(drag)] : [];
    if (preview) { ctx.lineWidth = Math.max(2, c.width / 300); ctx.setLineDash([10, 8]); ctx.strokeStyle = '#ffd60a'; [...boxes, ...tmp].forEach(b => ctx.strokeRect(b.x, b.y, b.w, b.h)); ctx.setLineDash([]); }
  };
  const norm = d => ({ x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) });
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { const [x, y] = pos(e); drag = { x0: x, y0: y, x1: x, y1: y, moved: false }; c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!drag) return; const [x, y] = pos(e); drag.x1 = x; drag.y1 = y; if (Math.abs(x - drag.x0) + Math.abs(y - drag.y0) > 8) drag.moved = true; draw(); };
  c.onpointerup = e => {
    if (!drag) return;
    if (drag.moved) { const b = norm(drag); if (b.w > 10 && b.h > 10) boxes.push(b); }
    else { const [x, y] = [drag.x0, drag.y0]; const i = boxes.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); if (i >= 0) boxes.splice(i, 1); }
    drag = null; draw();
  };
  draw();
  try { boxes = await detectFaces(img); $('#bst', m).textContent = boxes.length ? `נמצאו ${boxes.length} פרצופים ✓ אפשר לתקן ידנית` : 'לא נמצאו פרצופים אוטומטית. גררו על הפנים כדי לטשטש'; }
  catch (e) { console.error(e); $('#bst', m).textContent = 'הזיהוי האוטומטי לא נטען. גררו על הפנים כדי לטשטש'; }
  draw();
  $('#bcancel', m).onclick = () => m.remove();
  $('#bclr', m).onclick = () => { boxes = []; draw(); };
  $('#bsave', m).onclick = async () => {
    $('#bsave', m).disabled = true;
    draw(false); const out = canvasToJpeg(c);
    await updateDoc(dref('photoData', id), { display: out });
    await updateDoc(dref('photos', id), { blurred: boxes.length > 0 });
    imgCache.set(id, Promise.resolve(out));
    const im = $(`#pgrid img[data-pid="${id}"]`); if (im) im.src = out;
    m.remove();
  };
}

route();
</script>
